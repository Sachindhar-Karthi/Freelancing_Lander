<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FA"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98F238"/>
      <stop offset="100%" stop-color="#86E52B"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#aiBg)"/>
  
  <!-- Architectural Grid -->
  <g stroke="#DCE2E8" stroke-width="1" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="180" y1="0" x2="180" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="620" y1="0" x2="620" y2="500"/>
    <line x1="740" y1="0" x2="740" y2="500"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Central AI Interface Container -->
  <rect x="100" y="50" width="600" height="400" rx="16" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="100" y="50" width="600" height="44" rx="16" fill="#F8F9F6" stroke="#DCE2E8" stroke-width="1"/>
  <circle cx="126" cy="72" r="5" fill="#DCE2E8"/>
  <circle cx="142" cy="72" r="5" fill="#DCE2E8"/>
  <circle cx="158" cy="72" r="5" fill="#98F238"/>
  <text x="180" y="76" font-family="monospace" font-size="11" fill="#111827" font-weight="bold">SIGNAL_AI // TRANSPARENT REASONING ENGINE</text>

  <!-- Left Prompt / Chain of Thought Panel -->
  <rect x="124" y="114" width="260" height="240" rx="12" fill="#F8F9F6" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="140" y="132" width="90" height="12" rx="3" fill="#111827"/>
  <rect x="140" y="152" width="228" height="8" rx="3" fill="#697386" opacity="0.6"/>
  <rect x="140" y="166" width="180" height="8" rx="3" fill="#697386" opacity="0.6"/>
  
  <!-- Step 1 Complete -->
  <rect x="140" y="190" width="228" height="34" rx="8" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <circle cx="158" cy="207" r="7" fill="#E8FFD0"/>
  <path d="M155 207 L157 209 L161 205" stroke="#496F16" stroke-width="1.5" fill="none"/>
  <text x="174" y="211" font-family="sans-serif" font-size="10" fill="#111827" font-weight="bold">Context Grounding</text>

  <!-- Step 2 In-Progress -->
  <rect x="140" y="234" width="228" height="34" rx="8" fill="#FFFFFF" stroke="#98F238" stroke-width="1"/>
  <circle cx="158" cy="251" r="7" fill="#98F238"/>
  <text x="174" y="255" font-family="sans-serif" font-size="10" fill="#111827" font-weight="bold">Deterministic Verification</text>

  <!-- Step 3 Queued -->
  <rect x="140" y="278" width="228" height="34" rx="8" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <circle cx="158" cy="295" r="7" fill="#EEF3F7"/>
  <text x="174" y="299" font-family="sans-serif" font-size="10" fill="#697386">Output Synthesis</text>

  <!-- Right Streaming Synthesizer -->
  <rect x="404" y="114" width="272" height="240" rx="12" fill="#F8F9F6" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="424" y="132" width="120" height="12" rx="3" fill="#111827"/>
  <rect x="424" y="156" width="232" height="10" rx="3" fill="#354154"/>
  <rect x="424" y="174" width="200" height="10" rx="3" fill="#354154"/>
  <rect x="424" y="192" width="220" height="10" rx="3" fill="#354154"/>
  <rect x="424" y="210" width="140" height="10" rx="3" fill="#354154"/>
  <rect x="424" y="234" width="232" height="50" rx="8" fill="#FFFFFF" stroke="#98F238" stroke-width="1"/>
  <text x="436" y="254" font-family="monospace" font-size="9" fill="#496F16">CONFIDENCE: 99.4%</text>
  <text x="436" y="270" font-family="sans-serif" font-size="10" fill="#111827">Zero hallucinations detected.</text>

  <!-- Bottom Input Bar -->
  <rect x="124" y="374" width="460" height="52" rx="12" fill="#F4F7FA" stroke="#DCE2E8" stroke-width="1"/>
  <text x="144" y="405" font-family="sans-serif" font-size="12" fill="#697386">Query workspace parameters or pipeline metrics...</text>
  <rect x="600" y="374" width="76" height="52" rx="12" fill="url(#limeGrad)"/>
  <text x="622" y="405" font-family="sans-serif" font-size="12" fill="#111827" font-weight="bold">RUN</text>
</svg>

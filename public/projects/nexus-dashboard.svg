<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9F6"/>
      <stop offset="100%" stop-color="#F4F7FA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nexusBg)"/>

  <!-- Main Container -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1.5"/>
  
  <!-- Dashboard Top Nav -->
  <rect x="60" y="50" width="680" height="44" rx="14" fill="#F4F7FA" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="84" y="64" width="70" height="16" rx="4" fill="#111827"/>
  <rect x="170" y="66" width="50" height="12" rx="3" fill="#DCE2E8"/>
  <rect x="230" y="66" width="50" height="12" rx="3" fill="#DCE2E8"/>
  <rect x="290" y="66" width="50" height="12" rx="3" fill="#DCE2E8"/>
  <rect x="640" y="62" width="76" height="20" rx="10" fill="#E8FFD0"/>
  <circle cx="652" cy="72" r="3" fill="#496F16"/>

  <!-- Left Stats Panel -->
  <rect x="84" y="114" width="180" height="96" rx="10" fill="#F8F9F6" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="130" width="60" height="10" rx="2" fill="#697386"/>
  <rect x="100" y="148" width="100" height="22" rx="4" fill="#111827"/>
  <rect x="100" y="180" width="40" height="12" rx="3" fill="#E8FFD0"/>

  <rect x="84" y="222" width="180" height="204" rx="10" fill="#F8F9F6" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="238" width="80" height="10" rx="2" fill="#697386"/>
  <line x1="100" y1="260" x2="248" y2="260" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="272" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="296" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="320" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="344" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="100" y="368" width="120" height="14" rx="3" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>

  <!-- Central Chart Canvas -->
  <rect x="280" y="114" width="436" height="312" rx="10" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
  <rect x="304" y="134" width="120" height="14" rx="3" fill="#111827"/>
  <rect x="630" y="130" width="62" height="22" rx="6" fill="#98F238"/>

  <!-- Candlesticks / Bars -->
  <g stroke="#DCE2E8" stroke-width="1">
    <line x1="330" y1="180" x2="690" y2="180" stroke-dasharray="3 3"/>
    <line x1="330" y1="240" x2="690" y2="240" stroke-dasharray="3 3"/>
    <line x1="330" y1="300" x2="690" y2="300" stroke-dasharray="3 3"/>
    <line x1="330" y1="360" x2="690" y2="360" stroke-dasharray="3 3"/>
  </g>

  <!-- Financial Graph Polyline -->
  <polyline points="330,340 370,320 410,335 450,280 490,290 530,220 570,240 610,190 650,160 680,175" 
            fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Volume Bars -->
  <rect x="360" y="360" width="12" height="30" rx="2" fill="#DCE6F0"/>
  <rect x="400" y="350" width="12" height="40" rx="2" fill="#DCE6F0"/>
  <rect x="440" y="330" width="12" height="60" rx="2" fill="#98F238"/>
  <rect x="480" y="340" width="12" height="50" rx="2" fill="#DCE6F0"/>
  <rect x="520" y="310" width="12" height="80" rx="2" fill="#98F238"/>
  <rect x="560" y="325" width="12" height="65" rx="2" fill="#DCE6F0"/>
  <rect x="600" y="290" width="12" height="100" rx="2" fill="#98F238"/>
  <rect x="640" y="270" width="12" height="120" rx="2" fill="#98F238"/>

  <!-- Highlight Indicator Dot -->
  <circle cx="650" cy="160" r="6" fill="#98F238" stroke="#111827" stroke-width="2"/>
</svg>

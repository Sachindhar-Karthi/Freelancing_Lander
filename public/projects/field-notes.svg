<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FA"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98F238"/>
      <stop offset="100%" stop-color="#86E52B"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#fnBg)"/>
  
  <!-- Structural Blueprint Grid -->
  <g stroke="#DCE2E8" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Mobile Device Mockup -->
  <g transform="translate(270, 40)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="260" height="420" rx="36" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="2"/>
    <rect x="8" y="8" width="244" height="404" rx="28" fill="#F8F9F6"/>
    
    <!-- Notch / Camera Island -->
    <rect x="90" y="16" width="80" height="18" rx="9" fill="#111827"/>
    
    <!-- App Header -->
    <rect x="24" y="50" width="120" height="14" rx="4" fill="#111827"/>
    <rect x="180" y="48" width="56" height="18" rx="9" fill="#E8FFD0" stroke="#98F238" stroke-width="1"/>
    <text x="194" y="61" font-family="monospace" font-size="9" fill="#496F16" font-weight="bold">OFFLINE</text>
    
    <!-- Sync Status Strip -->
    <rect x="24" y="76" width="212" height="32" rx="8" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
    <circle cx="40" cy="92" r="5" fill="#98F238"/>
    <rect x="52" y="88" width="100" height="8" rx="3" fill="#354154"/>
    <rect x="190" y="88" width="34" height="8" rx="3" fill="#697386"/>

    <!-- Field Note Item 1 -->
    <rect x="24" y="118" width="212" height="74" rx="10" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
    <rect x="36" y="130" width="90" height="10" rx="3" fill="#111827"/>
    <rect x="36" y="146" width="150" height="7" rx="2.5" fill="#697386" opacity="0.6"/>
    <rect x="36" y="158" width="120" height="7" rx="2.5" fill="#697386" opacity="0.6"/>
    <circle cx="216" cy="140" r="8" fill="#E8FFD0"/>
    <path d="M213 140 L215 142 L219 138" stroke="#496F16" stroke-width="1.5" fill="none"/>

    <!-- Field Note Item 2 -->
    <rect x="24" y="202" width="212" height="74" rx="10" fill="#FFFFFF" stroke="#98F238" stroke-width="1"/>
    <rect x="36" y="214" width="110" height="10" rx="3" fill="#111827"/>
    <rect x="36" y="230" width="160" height="7" rx="2.5" fill="#697386" opacity="0.6"/>
    <rect x="36" y="242" width="100" height="7" rx="2.5" fill="#697386" opacity="0.6"/>
    <circle cx="216" cy="224" r="8" fill="#98F238"/>
    <path d="M213 224 L215 226 L219 222" stroke="#111827" stroke-width="1.5" fill="none"/>

    <!-- Field Note Item 3 -->
    <rect x="24" y="286" width="212" height="74" rx="10" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
    <rect x="36" y="298" width="80" height="10" rx="3" fill="#111827"/>
    <rect x="36" y="314" width="140" height="7" rx="2.5" fill="#697386" opacity="0.6"/>
    <rect x="36" y="326" width="110" height="7" rx="2.5" fill="#697386" opacity="0.6"/>

    <!-- Bottom Action FAB -->
    <rect x="24" y="370" width="212" height="34" rx="17" fill="url(#limeGrad)"/>
    <text x="100" y="391" font-family="sans-serif" font-size="11" fill="#111827" font-weight="bold">+ Log New Entry</text>
  </g>

  <!-- Left Supporting Context Cards -->
  <g transform="translate(70, 140)">
    <rect width="160" height="100" rx="12" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
    <text x="18" y="28" font-family="monospace" font-size="10" fill="#697386" font-weight="bold">SYNC ENGINE</text>
    <text x="18" y="52" font-family="sans-serif" font-size="18" fill="#111827" font-weight="bold">IndexedDB</text>
    <rect x="18" y="68" width="124" height="6" rx="3" fill="#E8FFD0"/>
    <rect x="18" y="68" width="96" height="6" rx="3" fill="#98F238"/>
  </g>

  <!-- Right Supporting Context Cards -->
  <g transform="translate(570, 140)">
    <rect width="160" height="100" rx="12" fill="#FFFFFF" stroke="#DCE2E8" stroke-width="1"/>
    <text x="18" y="28" font-family="monospace" font-size="10" fill="#697386" font-weight="bold">LATENCY</text>
    <text x="18" y="52" font-family="sans-serif" font-size="18" fill="#111827" font-weight="bold">0.0 ms</text>
    <text x="18" y="74" font-family="sans-serif" font-size="10" fill="#496F16">Zero network blocking</text>
  </g>
</svg>
